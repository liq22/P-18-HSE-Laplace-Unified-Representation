schema_version: 1
project_name: HSE-Laplace-Unified-Representation
stage: theory_contract
language: English

central_question: >-
  How can heterogeneous time-series observations be represented in a common
  physical space when their observable information only partially overlaps?

representation:
  shared_observable: flow_canonicalized
  observed_private: identity_preserved
  unobserved_private: diffusion_posterior
  coordinate_system: stable_laplace_modal

current_claim: >-
  Under explicit observability, regularity, and finite-modal assumptions, a
  distribution-valued unified representation can be constructed by combining
  source-only transport on common observable modes, identity on observed
  private modes, and a conditional diffusion posterior on unobserved modes.

claim_status: theoretical_candidate
formal_claim_supported: false
evidence_level: analytic_derivations_and_semantic_tests

largest_uncertainties:
  - whether the observable decomposition is identifiable from realistic metadata
  - whether a finite local Laplace dictionary is adequate for PHM transients
  - whether source-only canonical transport preserves fault semantics
  - whether diffusion uncertainty is calibrated on unobserved private modes

next_decisive_experiment: known_pole_paired_acquisition_falsification
stopping_condition: >-
  Stop or simplify the method if metadata-conditioned diffusion or ordinary
  optimal transport matches posterior calibration, private retention, and
  common-mode comparability under the same information and compute budget.
