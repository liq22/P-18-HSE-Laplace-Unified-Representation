schema_version: 2
project_name: HSE-Laplace-Source-Supported-Representation
stage: corrected_theory_contract
language: English

scope: >-
  Cross-acquisition representation of one shared local dynamical process under
  partially overlapping structural modal support. The project does not cover
  arbitrary unrelated heterogeneous time series.

central_question: >-
  How should multiple acquisition operators represent a shared local dynamical
  process when some modal components are common, some are observed only in the
  current domain, some are missing locally but supported by other source
  domains, and some are unsupported by all source domains?

representation:
  shared_observable: source_population_flow_canonicalized
  observed_private: identity_preserved
  recoverable_missing: conditional_posterior
  global_null: unsupported_no_data_driven_recovery
  dependency: triangular_shared_then_missing
  coordinate_system: local_stable_laplace_modal
  structural_observability: domain_level
  instance_reliability: sample_level

current_claim: >-
  Under explicit structural-observability, finite-modal and regularity
  assumptions, a source-supported distribution-valued representation can be
  constructed by canonicalizing common observable modes at the source
  population level, preserving observed-private modes, representing
  recoverable-missing modes by a conditional posterior, and excluding
  source-global-null modes from learned recovery claims.

claim_status: theoretical_candidate
formal_claim_supported: false
evidence_level: analytic_derivations_and_semantic_tests

largest_uncertainties:
  - whether structural modal roles can be identified from realistic acquisition metadata
  - whether paired source data identify the recoverable-missing conditional
  - whether a local damped-modal dictionary is adequate for event-local PHM transients
  - whether a Gaussian or mixture posterior already matches Diffusion
  - whether affine calibration or ordinary optimal transport already matches Flow
  - whether source-only canonicalization preserves fault semantics

next_decisive_experiment: known_pole_2x2x2_oracle_falsification
stopping_condition: >-
  Stop or simplify a mechanism when the corresponding simple baseline matches
  it under the same information and compute budget: Gaussian or mixture models
  for missing posterior, affine/CORAL/ordinary OT for shared canonicalization,
  and a direct time-domain latent for the Laplace representation.
