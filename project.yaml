schema_version: 5
project_name: HSE-LapDiff
stage: linear_gaussian_theory_oracle
language: English

scope: >-
  Multiple acquisition operators observe the same window-local dynamical event
  through different sampling rates, timestamps, masks, channels, noise levels,
  and sensor responses.

active_method:
  conditioner: fixed_physical_hse_tokens
  generative_model: latent_laplace_diffusion
  target: canonical_laplace_latent_posterior
  flow_matching: future_work_only

central_claim_under_test: >-
  HSE can encode acquisition score, information, physical time, frequency
  support, and reliability into a fixed token interface that conditions
  Latent Laplace Diffusion to produce calibrated posteriors in one canonical
  modal coordinate system without imposing complete deterministic invariance.

theory_status:
  fixed_dimensional_sufficiency: proved_in_linear_gaussian_case
  closed_form_canonical_posterior: proved_in_linear_gaussian_case
  acquisition_information_monotonicity: proved_under_loewner_order
  paired_conditional_identifiability: proved_up_to_null_sets
  complete_invariance_risk_lower_bound: proved_for_paired_deterministic_invariance_and_log_loss
  posterior_sufficiency: proved_under_latent_markov_condition
  laplace_stability_and_gap_shift: supporting_results

current_evidence:
  analytic_oracle: completed
  semantic_tests: completed
  theory_notebook_witnesses: completed_locally_pending_ci
  learned_model: not_started
  known_pole_paired_experiment: not_started
  real_phm: not_started

formal_claim_supported: false
next_decisive_experiment: known_pole_paired_acquisition_posterior_calibration
stop_condition: >-
  Simplify or stop the generative claim if a heteroscedastic Gaussian or finite
  mixture conditioned on the same HSE tokens matches LLapDiff on paired proper
  scores, calibration, and task-sensitive posterior decisions.
