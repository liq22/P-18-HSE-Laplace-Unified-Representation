<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 640" width="180mm" height="64.0mm" role="img"><title>Observation overlap and conditional identification</title><desc>Problem-only source support and two indistinguishable binary worlds.</desc><style>text{font-family:DejaVu Sans,sans-serif;fill:#243345;font-size:27px}.title{font-size:37px;font-weight:700}.head{font-size:30px;font-weight:700}.small{font-size:24px}.label{font-size:25px;font-weight:700}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#526778" /></marker></defs><rect id="canvas" x="0" y="0" width="1800" height="640" fill="white" /><text id="concept-title" x="35" y="55" class="title" text-anchor="start"><tspan x="35" dy="0">Observation overlap does not identify every conditional</tspan></text><rect id="support-panel" x="35" y="105" width="825" height="420" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><rect id="ambiguity-panel" x="905" y="105" width="860" height="420" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="support-heading" x="60" y="152" class="head" text-anchor="start"><tspan x="60" dy="0">a  Source-relative observation support</tspan></text><text id="support-scope" x="60" y="192" class="small" text-anchor="start"><tspan x="60" dy="0">Aligned coordinates; events are not paired across sources</tspan></text><text id="coordinate-0" x="390" y="240" class="label" text-anchor="middle"><tspan x="390" dy="0">C</tspan></text><text id="coordinate-1" x="515" y="240" class="label" text-anchor="middle"><tspan x="515" dy="0">P</tspan></text><text id="coordinate-2" x="640" y="240" class="label" text-anchor="middle"><tspan x="640" dy="0">M</tspan></text><text id="coordinate-3" x="755" y="240" class="label" text-anchor="middle"><tspan x="755" dy="0">N₀</tspan></text><text id="source-name-0" x="65" y="300" class="" text-anchor="start"><tspan x="65" dy="0">Source A</tspan></text><rect id="support-0-0" x="363" y="268" width="54" height="43" rx="8" fill="#e3f1ee" stroke="#347b74" stroke-width="2" /><text id="value-0-0" x="390" y="300" class="" text-anchor="middle"><tspan x="390" dy="0">1</tspan></text><rect id="support-0-1" x="488" y="268" width="54" height="43" rx="8" fill="#e3f1ee" stroke="#347b74" stroke-width="2" /><text id="value-0-1" x="515" y="300" class="" text-anchor="middle"><tspan x="515" dy="0">1</tspan></text><rect id="support-0-2" x="613" y="268" width="54" height="43" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="value-0-2" x="640" y="300" class="" text-anchor="middle"><tspan x="640" dy="0">0</tspan></text><rect id="support-0-3" x="728" y="268" width="54" height="43" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="value-0-3" x="755" y="300" class="" text-anchor="middle"><tspan x="755" dy="0">0</tspan></text><text id="source-name-1" x="65" y="360" class="" text-anchor="start"><tspan x="65" dy="0">Source B</tspan></text><rect id="support-1-0" x="363" y="328" width="54" height="43" rx="8" fill="#e3f1ee" stroke="#347b74" stroke-width="2" /><text id="value-1-0" x="390" y="360" class="" text-anchor="middle"><tspan x="390" dy="0">1</tspan></text><rect id="support-1-1" x="488" y="328" width="54" height="43" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="value-1-1" x="515" y="360" class="" text-anchor="middle"><tspan x="515" dy="0">0</tspan></text><rect id="support-1-2" x="613" y="328" width="54" height="43" rx="8" fill="#e3f1ee" stroke="#347b74" stroke-width="2" /><text id="value-1-2" x="640" y="360" class="" text-anchor="middle"><tspan x="640" dy="0">1</tspan></text><rect id="support-1-3" x="728" y="328" width="54" height="43" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="value-1-3" x="755" y="360" class="" text-anchor="middle"><tspan x="755" dy="0">0</tspan></text><text id="source-name-2" x="65" y="420" class="" text-anchor="start"><tspan x="65" dy="0">Current view</tspan></text><rect id="support-2-0" x="363" y="388" width="54" height="43" rx="8" fill="#e3f1ee" stroke="#347b74" stroke-width="2" /><text id="value-2-0" x="390" y="420" class="" text-anchor="middle"><tspan x="390" dy="0">1</tspan></text><rect id="support-2-1" x="488" y="388" width="54" height="43" rx="8" fill="#e3f1ee" stroke="#347b74" stroke-width="2" /><text id="value-2-1" x="515" y="420" class="" text-anchor="middle"><tspan x="515" dy="0">1</tspan></text><rect id="support-2-2" x="613" y="388" width="54" height="43" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="value-2-2" x="640" y="420" class="" text-anchor="middle"><tspan x="640" dy="0">0</tspan></text><rect id="support-2-3" x="728" y="388" width="54" height="43" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="value-2-3" x="755" y="420" class="" text-anchor="middle"><tspan x="755" dy="0">0</tspan></text><text id="role-0" x="390" y="490" class="small" text-anchor="middle"><tspan x="390" dy="0">common</tspan></text><text id="role-1" x="515" y="490" class="small" text-anchor="middle"><tspan x="515" dy="0">private</tspan></text><text id="role-2" x="640" y="490" class="small" text-anchor="middle"><tspan x="640" dy="0">missing</tspan></text><text id="role-3" x="755" y="490" class="small" text-anchor="middle"><tspan x="755" dy="0">global-null</tspan></text><text id="ambiguity-heading" x="930" y="152" class="head" text-anchor="start"><tspan x="930" dy="0">b  Identical source laws, opposite answers</tspan></text><text id="bit-assumptions" x="930" y="198" class="small" text-anchor="start"><tspan x="930" dy="0">C and P are independent fair bits</tspan></text><rect id="world-plus" x="935" y="223" width="350" height="76" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><rect id="world-minus" x="1320" y="223" width="415" height="76" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="plus-law" x="1110" y="270" class="" text-anchor="middle"><tspan x="1110" dy="0">World +: M = P</tspan></text><text id="minus-law" x="1527" y="270" class="" text-anchor="middle"><tspan x="1527" dy="0">World −: M = 1 − P</tspan></text><text id="equal-source-laws" x="935" y="346" class="small" text-anchor="start"><tspan x="935" dy="0">Same p(C,P) and p(C,M) in both worlds</tspan><tspan x="935" dy="38">Same common-view conditional p(M | C)</tspan></text><text id="different-full-conditionals" x="935" y="440" class="" text-anchor="start"><tspan x="935" dy="0">p₊(M=1 | C=1,P=1) = 1</tspan><tspan x="935" dy="38">p₋(M=1 | C=1,P=1) = 0</tspan></text><text id="problem-object" x="35" y="579" class="label" text-anchor="start"><tspan x="35" dy="0">Required object: the joint target p(zₒ,w₀ | C_F), under the complete available observation.</tspan></text><text id="concept-boundary" x="35" y="622" class="small" text-anchor="start"><tspan x="35" dy="0">Support is a geometric property. Conditional identification depends on the source observation law.</tspan></text></svg>