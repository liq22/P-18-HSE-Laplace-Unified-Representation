<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1380" width="180mm" height="138mm" role="img"><title>Qualify the missing target and its condition together</title><desc>Overlapping source views can have identical observed laws but opposite full-input missing conditionals. A source-qualified target conditions restricted HSE–LLapDiff inference. A restriction-by-dynamics contrast tests posterior and diagnostic effects separately.</desc><style>text{font-family:DejaVu Sans,sans-serif;fill:#1f2b3b;font-size:27px}.title{font-size:39px;font-weight:700}.head{font-size:31px;font-weight:700}.small{font-size:23px}.core{font-size:32px;font-weight:700}.muted{fill:#536171}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#536171" /></marker><marker id="eligible" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#157a85" /></marker></defs><rect id="canvas" x="0" y="0" width="1800" height="1380" fill="white" /><text id="main-title" x="40" y="62" class="title" text-anchor="start"><tspan x="40" dy="0">Qualify the missing target and its condition together</tspan></text><text id="subtitle" x="40" y="105" class="small" text-anchor="start"><tspan x="40" dy="0">Shared observations do not determine every missing-state conditional.</tspan></text><rect id="panel-a" x="40" y="140" width="840" height="365" rx="10" fill="#f5f7fa" stroke="#aab5c3" stroke-width="2" /><text id="panel-a-heading" x="64" y="186" class="head" text-anchor="start"><tspan x="64" dy="0">a  Source-relative observation support</tspan></text><text id="panel-a-note" x="64" y="225" class="small" text-anchor="start"><tspan x="64" dy="0">Aligned reference; source events are unpaired</tspan></text><text id="column-0" x="400" y="275" class="small" text-anchor="middle"><tspan x="400" dy="0">C</tspan></text><text id="column-1" x="515" y="275" class="small" text-anchor="middle"><tspan x="515" dy="0">P</tspan></text><text id="column-2" x="630" y="275" class="small" text-anchor="middle"><tspan x="630" dy="0">M</tspan></text><text id="column-3" x="745" y="275" class="small" text-anchor="middle"><tspan x="745" dy="0">N₀</tspan></text><text id="row-name-0" x="70" y="332" class="" text-anchor="start"><tspan x="70" dy="0">Source A</tspan></text><rect id="support-0-0" x="371" y="303" width="58" height="39" rx="10" fill="#d7ecef" stroke="#80949d" stroke-width="2" /><text id="support-value-0-0" x="400" y="332" class="" text-anchor="middle"><tspan x="400" dy="0">1</tspan></text><rect id="support-0-1" x="486" y="303" width="58" height="39" rx="10" fill="#d7ecef" stroke="#80949d" stroke-width="2" /><text id="support-value-0-1" x="515" y="332" class="" text-anchor="middle"><tspan x="515" dy="0">1</tspan></text><rect id="support-0-2" x="601" y="303" width="58" height="39" rx="10" fill="#eceff3" stroke="#80949d" stroke-width="2" /><text id="support-value-0-2" x="630" y="332" class="" text-anchor="middle"><tspan x="630" dy="0">0</tspan></text><rect id="support-0-3" x="716" y="303" width="58" height="39" rx="10" fill="#eceff3" stroke="#80949d" stroke-width="2" /><text id="support-value-0-3" x="745" y="332" class="" text-anchor="middle"><tspan x="745" dy="0">0</tspan></text><text id="row-name-1" x="70" y="385" class="" text-anchor="start"><tspan x="70" dy="0">Source B</tspan></text><rect id="support-1-0" x="371" y="356" width="58" height="39" rx="10" fill="#d7ecef" stroke="#80949d" stroke-width="2" /><text id="support-value-1-0" x="400" y="385" class="" text-anchor="middle"><tspan x="400" dy="0">1</tspan></text><rect id="support-1-1" x="486" y="356" width="58" height="39" rx="10" fill="#eceff3" stroke="#80949d" stroke-width="2" /><text id="support-value-1-1" x="515" y="385" class="" text-anchor="middle"><tspan x="515" dy="0">0</tspan></text><rect id="support-1-2" x="601" y="356" width="58" height="39" rx="10" fill="#d7ecef" stroke="#80949d" stroke-width="2" /><text id="support-value-1-2" x="630" y="385" class="" text-anchor="middle"><tspan x="630" dy="0">1</tspan></text><rect id="support-1-3" x="716" y="356" width="58" height="39" rx="10" fill="#eceff3" stroke="#80949d" stroke-width="2" /><text id="support-value-1-3" x="745" y="385" class="" text-anchor="middle"><tspan x="745" dy="0">0</tspan></text><text id="row-name-2" x="70" y="438" class="" text-anchor="start"><tspan x="70" dy="0">Current view</tspan></text><rect id="support-2-0" x="371" y="409" width="58" height="39" rx="10" fill="#d7ecef" stroke="#80949d" stroke-width="2" /><text id="support-value-2-0" x="400" y="438" class="" text-anchor="middle"><tspan x="400" dy="0">1</tspan></text><rect id="support-2-1" x="486" y="409" width="58" height="39" rx="10" fill="#d7ecef" stroke="#80949d" stroke-width="2" /><text id="support-value-2-1" x="515" y="438" class="" text-anchor="middle"><tspan x="515" dy="0">1</tspan></text><rect id="support-2-2" x="601" y="409" width="58" height="39" rx="10" fill="#eceff3" stroke="#80949d" stroke-width="2" /><text id="support-value-2-2" x="630" y="438" class="" text-anchor="middle"><tspan x="630" dy="0">0</tspan></text><rect id="support-2-3" x="716" y="409" width="58" height="39" rx="10" fill="#eceff3" stroke="#80949d" stroke-width="2" /><text id="support-value-2-3" x="745" y="438" class="" text-anchor="middle"><tspan x="745" dy="0">0</tspan></text><text id="roles-label" x="65" y="484" class="small" text-anchor="start"><tspan x="65" dy="0">Current role:</tspan></text><text id="role-common" x="400" y="484" class="small" text-anchor="middle"><tspan x="400" dy="0">common</tspan></text><text id="role-private" x="515" y="484" class="small" text-anchor="middle"><tspan x="515" dy="0">private</tspan></text><text id="role-missing" x="630" y="484" class="small" text-anchor="middle"><tspan x="630" dy="0">missing</tspan></text><text id="role-global-null" x="745" y="484" class="small" text-anchor="middle"><tspan x="745" dy="0">global-null</tspan></text><rect id="panel-b" x="920" y="140" width="840" height="365" rx="10" fill="#f5f7fa" stroke="#aab5c3" stroke-width="2" /><text id="panel-b-heading" x="944" y="186" class="head" text-anchor="start"><tspan x="944" dy="0">b  Same sources, different conditionals</tspan></text><text id="counterexample-assumptions" x="953" y="227" class="small" text-anchor="start"><tspan x="953" dy="0">C and P: independent fair bits</tspan></text><rect id="world-plus" x="954" y="248" width="348" height="62" rx="10" fill="#fff6e9" stroke="#b7976e" stroke-width="2" /><rect id="world-minus" x="1330" y="248" width="395" height="62" rx="10" fill="#fff6e9" stroke="#b7976e" stroke-width="2" /><text id="world-plus-law" x="1128" y="289" class="" text-anchor="middle"><tspan x="1128" dy="0">World +: M = P</tspan></text><text id="world-minus-law" x="1527" y="289" class="" text-anchor="middle"><tspan x="1527" dy="0">World −: M = 1 − P</tspan></text><text id="identification-ambiguity" x="953" y="348" class="small" text-anchor="start"><tspan x="953" dy="0">Same laws of (C,P) and (C,M)</tspan><tspan x="953" dy="33">Opposite p(M | C,P); same p(M | C)</tspan></text><path id="permission-arrow" d="M1330,393 L1330,412" fill="none" stroke="#157a85" stroke-width="3" marker-end="url(#eligible)" /><rect id="eligible-target" x="954" y="426" width="771" height="58" rx="10" fill="#e0f2ef" stroke="#157a85" stroke-width="2" /><text id="eligible-target-text" x="1338" y="463" class="" text-anchor="middle"><tspan x="1338" dy="0">Qualify (Iₑ, C_T); fix projector Gₑ</tspan></text><rect id="panel-c" x="40" y="545" width="1720" height="550" rx="10" fill="#f5f7fa" stroke="#aab5c3" stroke-width="2" /><text id="panel-c-heading" x="64" y="594" class="head" text-anchor="start"><tspan x="64" dy="0">c  Proposed HSE–LLapDiff inference</tspan></text><rect id="observed-input" x="75" y="645" width="310" height="154" rx="10" fill="#f5f7fa" stroke="#aab5c3" stroke-width="2" /><text id="observed-input-title" x="99" y="687" class="head" text-anchor="start"><tspan x="99" dy="0">Observation</tspan></text><text id="observed-input-lines" x="99" y="728" class="small" text-anchor="start"><tspan x="99" dy="0">Values + times + mask</tspan><tspan x="99" dy="35">Acquisition descriptor aₑ</tspan></text><path id="input-to-hse" d="M385,721 L427,721" fill="none" stroke="#536171" stroke-width="3" marker-end="url(#arrow)" /><rect id="hse-condition" x="445" y="645" width="320" height="154" rx="10" fill="#ece8f4" stroke="#806b98" stroke-width="2" /><text id="hse-title" x="471" y="687" class="head" text-anchor="start"><tspan x="471" dy="0">HSE condition</tspan></text><text id="hse-lines" x="471" y="728" class="small" text-anchor="start"><tspan x="471" dy="0">Observed + private</tspan><tspan x="471" dy="35">Global moment anchor</tspan></text><path id="hse-to-generative" d="M765,721 L835,721" fill="none" stroke="#157a85" stroke-width="3" marker-end="url(#eligible)" /><rect id="llapdiff-core" x="855" y="645" width="445" height="197" rx="10" fill="#e0f2ef" stroke="#157a85" stroke-width="2" /><text id="llapdiff-title" x="885" y="688" class="core" text-anchor="start"><tspan x="885" dy="0">LLapDiff posterior</tspan></text><text id="llapdiff-lines" x="885" y="733" class="small" text-anchor="start"><tspan x="885" dy="0">Gaussian latent perturbation</tspan><tspan x="885" dy="37">Stable temporal mode synthesis</tspan><tspan x="885" dy="37">Eligible-only reverse updates</tspan></text><path id="roles-to-generation" d="M1330,505 L1330,612 L1080,612 L1080,635" fill="none" stroke="#157a85" stroke-width="3" marker-end="url(#eligible)" /><text id="permission-tag" x="1370" y="585" class="small" text-anchor="start"><tspan x="1370" dy="0">Qualified joint law</tspan></text><path id="posterior-output-arrow" d="M1300,742 L1343,742" fill="none" stroke="#157a85" stroke-width="3" marker-end="url(#eligible)" /><rect id="posterior-output" x="1362" y="645" width="365" height="276" rx="10" fill="#edf3f8" stroke="#63829b" stroke-width="2" /><text id="posterior-title" x="1387" y="689" class="head" text-anchor="start"><tspan x="1387" dy="0">Posterior features</tspan></text><text id="posterior-lines" x="1387" y="738" class="small" text-anchor="start"><tspan x="1387" dy="0">Observed evidence</tspan><tspan x="1387" dy="40">Coherent posterior samples</tspan><tspan x="1387" dy="40">Support + inference status</tspan></text><text id="posterior-diagnosis" x="1387" y="887" class="small" text-anchor="start"><tspan x="1387" dy="0">Source-trained diagnosis</tspan></text><path id="preserved-observed-path" d="M605,799 L605,889 L1343,889" fill="none" stroke="#536171" stroke-width="3" marker-end="url(#arrow)" /><text id="preserve-evidence" x="652" y="874" class="small" text-anchor="start"><tspan x="652" dy="0">Preserve observed evidence and its uncertainty</tspan></text><rect id="unsupported-output" x="75" y="956" width="740" height="90" rx="10" fill="#f0f0f1" stroke="#8f9299" stroke-width="2" /><text id="unsupported-lines" x="100" y="992" class="small" text-anchor="start"><tspan x="100" dy="0">Globally unsupported / unidentified missing:</tspan><tspan x="100" dy="32">no recovered-value output</tspan></text><rect id="laplace-boundary" x="855" y="956" width="872" height="90" rx="10" fill="#fff6e9" stroke="#b7976e" stroke-width="2" /><text id="laplace-boundary-text" x="880" y="992" class="small" text-anchor="start"><tspan x="880" dy="0">Laplace dynamics ≠ Laplace-distributed noise</tspan><tspan x="880" dy="32">Physical support requires a validated reference/decoder.</tspan></text><rect id="panel-d" x="40" y="1135" width="1720" height="200" rx="10" fill="#f5f7fa" stroke="#aab5c3" stroke-width="2" /><text id="panel-d-heading" x="64" y="1182" class="head" text-anchor="start"><tspan x="64" dy="0">d  Separate mechanisms and outcomes</tspan></text><text id="posterior-metric-title" x="75" y="1230" class="small" text-anchor="start"><tspan x="75" dy="0">Posterior quality</tspan></text><text id="posterior-metric-detail" x="75" y="1270" class="small" text-anchor="start"><tspan x="75" dy="0">Same joint target</tspan><tspan x="75" dy="31">Energy Score / known-law KL</tspan></text><text id="diagnosis-metric-title" x="496" y="1230" class="small" text-anchor="start"><tspan x="496" dy="0">Unseen-dataset diagnosis</tspan></text><text id="diagnosis-metric-detail" x="496" y="1270" class="small" text-anchor="start"><tspan x="496" dy="0">Original-group LODO</tspan><tspan x="496" dy="31">Macro-F1 + balanced accuracy</tspan></text><text id="support-metric-title" x="917" y="1230" class="small" text-anchor="start"><tspan x="917" dy="0">Coverage and evidence</tspan></text><text id="support-metric-detail" x="917" y="1270" class="small" text-anchor="start"><tspan x="917" dy="0">Unsupported emissions</tspan><tspan x="917" dy="31">Admitted coverage + utility</tspan></text><text id="attribution-metric-title" x="1338" y="1230" class="small" text-anchor="start"><tspan x="1338" dy="0">Restriction × dynamics</tspan></text><text id="attribution-metric-detail" x="1338" y="1270" class="small" text-anchor="start"><tspan x="1338" dy="0">Ordinary / Laplace</tspan><tspan x="1338" dy="31">Unrestricted / projected</tspan></text><text id="footer" x="40" y="1370" class="small" text-anchor="start"><tspan x="40" dy="0">Fixed source data, condition and scored target; separate conditioner controls and measured cost.</tspan></text></svg>