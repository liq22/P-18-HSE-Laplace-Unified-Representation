<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1320" width="180mm" height="132.0mm" role="img"><title>Source-qualified conditional latent inference</title><desc>Source preparation, measured evidence, observed uncertainty, restricted reverse updates and diagnosis.</desc><style>text{font-family:DejaVu Sans,sans-serif;fill:#243345;font-size:27px}.title{font-size:37px;font-weight:700}.head{font-size:30px;font-weight:700}.small{font-size:24px}.role{font-size:21px}.label{font-size:25px;font-weight:700}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#526778" /></marker></defs><rect id="canvas" x="0" y="0" width="1800" height="1320" fill="white" /><text id="overview-title" x="35" y="55" class="title" text-anchor="start"><tspan x="35" dy="0">Source-qualified conditional latent inference</tspan></text><rect id="legend-inherited" x="1155" y="25" width="34" height="28" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="legend-inherited-text" x="1203" y="49" class="small" text-anchor="start"><tspan x="1203" dy="0">Inherited</tspan></text><rect id="legend-proposed" x="1385" y="25" width="34" height="28" rx="8" fill="#e3f1ee" stroke="#347b74" stroke-width="2" /><text id="legend-proposed-text" x="1435" y="49" class="small" text-anchor="start"><tspan x="1435" dy="0">Proposed restriction</tspan></text><text id="source-heading" x="35" y="111" class="head" text-anchor="start"><tspan x="35" dy="0">a  Source-only preparation</tspan></text><rect id="source-reference" x="35" y="145" width="490" height="157" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" stroke-dasharray="9 6" /><text id="source-reference-title" x="60" y="187" class="label" text-anchor="start"><tspan x="60" dy="0">Recordings and reference</tspan></text><text id="source-reference-content" x="60" y="227" class="small" text-anchor="start"><tspan x="60" dy="0">Split original groups first</tspan><tspan x="60" dy="35">Reference targets are training-only</tspan></text><path id="source-to-target" d="M525,224 L578,224" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" stroke-dasharray="9 6" /><rect id="qualified-target" x="595" y="145" width="600" height="157" rx="8" fill="#e3f1ee" stroke="#347b74" stroke-width="2" stroke-dasharray="9 6" /><text id="qualified-target-title" x="620" y="187" class="label" text-anchor="start"><tspan x="620" dy="0">Joint target + actual condition</tspan></text><text id="qualified-target-content" x="620" y="227" class="small" text-anchor="start"><tspan x="620" dy="0">Joint source tuple (C_F,zₒ,w₀)</tspan><tspan x="620" dy="35">Bₑ = Qₑ null(AₑQₑ); Gₑ = BₑBₑᵀ</tspan></text><path id="target-to-source-fit" d="M1195,224 L1248,224" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" stroke-dasharray="9 6" /><rect id="source-fit" x="1265" y="145" width="500" height="157" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" stroke-dasharray="9 6" /><text id="source-fit-title" x="1290" y="187" class="label" text-anchor="start"><tspan x="1290" dy="0">Fit and freeze on sources</tspan></text><text id="source-fit-content" x="1290" y="227" class="small" text-anchor="start"><tspan x="1290" dy="0">Anchor, observed readout, head</tspan><tspan x="1290" dy="35">Trainable generator; fixed readouts</tspan></text><text id="deployment-heading" x="35" y="380" class="head" text-anchor="start"><tspan x="35" dy="0">b  Deployment: no reference target or target labels</tspan></text><rect id="measured-input" x="35" y="425" width="350" height="135" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="measured-title" x="60" y="466" class="label" text-anchor="start"><tspan x="60" dy="0">Measured record C_F</tspan></text><text id="measured-content" x="60" y="507" class="small" text-anchor="start"><tspan x="60" dy="0">Values / times / masks</tspan><tspan x="60" dy="35">Acquisition descriptor a</tspan></text><path id="input-to-hse" d="M385,492 L435,492" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" /><rect id="hse-condition" x="450" y="425" width="345" height="135" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="hse-title" x="475" y="466" class="label" text-anchor="start"><tspan x="475" dy="0">HSE + moment anchor</tspan></text><text id="hse-content" x="475" y="507" class="small" text-anchor="start"><tspan x="475" dy="0">Generative condition C_T</tspan><tspan x="475" dy="35">R / H_A / H_M control</tspan></text><rect id="sampler" x="850" y="415" width="915" height="440" rx="8" fill="#e3f1ee" stroke="#347b74" stroke-width="2" /><text id="sampler-heading" x="875" y="456" class="head" text-anchor="start"><tspan x="875" dy="0">Eligible-only reverse process</tspan></text><text id="sampler-initialization" x="875" y="495" class="small" text-anchor="start"><tspan x="875" dy="0">Initialize w_K ~ N(0,I); zₒ fixed within each draw</tspan></text><rect id="reverse-state" x="880" y="535" width="240" height="115" rx="8" fill="#e3f1ee" stroke="#347b74" stroke-width="2" /><text id="state-title" x="900" y="573" class="label" text-anchor="start"><tspan x="900" dy="0">State w_k</tspan></text><text id="state-content" x="900" y="612" class="small" text-anchor="start"><tspan x="900" dy="0">Bₑw_k</tspan></text><path id="state-to-denoiser" d="M1120,592 L1155,592" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" /><rect id="temporal-denoiser" x="1170" y="535" width="270" height="115" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="denoiser-title" x="1190" y="573" class="label" text-anchor="start"><tspan x="1190" dy="0">Time denoiser</tspan></text><text id="denoiser-content" x="1190" y="610" class="small" text-anchor="start"><tspan x="1190" dy="0">Physical time t</tspan><tspan x="1190" dy="30">Ordinary / Laplace</tspan></text><path id="denoiser-to-conversion" d="M1440,592 L1470,592" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" /><rect id="velocity-conversion" x="1485" y="535" width="250" height="115" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="conversion-title" x="1505" y="573" class="label" text-anchor="start"><tspan x="1505" dy="0">Convert v̂</tspan></text><text id="conversion-content" x="1505" y="611" class="small" text-anchor="start"><tspan x="1505" dy="0">ŵ₀ = αw_k − σv̂</tspan><tspan x="1505" dy="30">ε̂ = σw_k + αv̂</tspan></text><path id="conversion-to-update" d="M1610,650 L1610,708" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" /><rect id="restricted-update" x="1200" y="723" width="535" height="97" rx="8" fill="#e3f1ee" stroke="#347b74" stroke-width="2" /><text id="update-title" x="1220" y="759" class="label" text-anchor="start"><tspan x="1220" dy="0">DDIM update in the admitted basis</tspan></text><text id="update-content" x="1220" y="798" class="small" text-anchor="start"><tspan x="1220" dy="0">w_s = α_s ŵ₀ + σ_s ε̂; z_s = Bₑw_s</tspan></text><path id="reverse-loop" d="M1200,771 L1000,771 L1000,665" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" /><text id="reverse-loop-label" x="1018" y="709" class="small" text-anchor="start"><tspan x="1018" dy="0">next k = s</tspan></text><path id="condition-to-denoiser" d="M625,425 L625,400 L1305,400 L1305,522" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" /><path id="qualified-target-to-sampler" d="M895,302 L895,331 L1748,331 L1748,407" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" stroke-dasharray="9 6" /><text id="basis-edge-label" x="1340" y="322" class="small" text-anchor="start"><tspan x="1340" dy="0">Frozen target / basis</tspan></text><path id="input-to-observed-readout" d="M210,560 L210,625" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" /><rect id="observed-readout" x="35" y="642" width="350" height="165" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="observed-title" x="60" y="684" class="label" text-anchor="start"><tspan x="60" dy="0">Observed uncertainty</tspan></text><text id="observed-content" x="60" y="725" class="small" text-anchor="start"><tspan x="60" dy="0">qₒ(zₒ | C_F)</tspan><tspan x="60" dy="31">Sample zₒ once per draw</tspan><tspan x="60" dy="31">No clean-value clamping</tspan></text><path id="observed-draw-to-sampler" d="M385,724 L837,724" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" /><text id="observed-edge-label" x="454" y="707" class="small" text-anchor="start"><tspan x="454" dy="0">Same zₒ in every reverse step</tspan></text><rect id="coherent-tuple" x="450" y="960" width="470" height="151" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="tuple-title" x="475" y="1004" class="label" text-anchor="start"><tspan x="475" dy="0">Conditional partial-state draw</tspan></text><text id="tuple-content" x="475" y="1043" class="small" text-anchor="start"><tspan x="475" dy="0">(zₒ, Bₑw₀) + support status</tspan><tspan x="475" dy="35">No value for unestimated entries</tspan></text><path id="observed-draw-to-tuple" d="M210,807 L210,1034 L435,1034" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" /><path id="generated-draw-to-tuple" d="M1468,855 L1468,900 L685,900 L685,946" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" /><text id="generated-edge-label" x="993" y="887" class="small" text-anchor="start"><tspan x="993" dy="0">Eligible missing sample Bₑw₀</tspan></text><path id="tuple-to-head" d="M920,1034 L1020,1034" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" /><rect id="fixed-diagnostic-head" x="1035" y="960" width="360" height="151" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="diagnostic-title" x="1060" y="1004" class="label" text-anchor="start"><tspan x="1060" dy="0">Fixed source head hψ</tspan></text><text id="diagnostic-content" x="1060" y="1043" class="small" text-anchor="start"><tspan x="1060" dy="0">Same observed code R</tspan><tspan x="1060" dy="35">Same source-label training</tspan></text><path id="hse-observed-bypass" d="M795,533 L813,533 L813,929 L1215,929 L1215,947" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" /><text id="bypass-label" x="850" y="919" class="small" text-anchor="start"><tspan x="850" dy="0">R: retained observed evidence</tspan></text><path id="head-to-prediction" d="M1395,1034 L1465,1034" fill="none" stroke="#526778" stroke-width="2.8" marker-end="url(#arrow)" /><rect id="predictive-output" x="1480" y="960" width="285" height="151" rx="8" fill="#f3f5f7" stroke="#8b9aa7" stroke-width="2" /><text id="output-title" x="1500" y="1004" class="label" text-anchor="start"><tspan x="1500" dy="0">Average L draws</tspan></text><text id="output-content" x="1500" y="1043" class="small" text-anchor="start"><tspan x="1500" dy="0">Class probability p̂(y)</tspan><tspan x="1500" dy="35">No target fitting</tspan></text><text id="process-rule" x="35" y="1173" class="label" text-anchor="start"><tspan x="35" dy="0">Restriction r acts during fitting and every reverse update, not only on the final output.</tspan></text><text id="effect-readout" x="35" y="1220" class="small" text-anchor="start"><tspan x="35" dy="0">r × temporal structure ℓ: same scored target; separate posterior, diagnosis, coverage and cost.</tspan></text><text id="empty-rule" x="35" y="1270" class="small" text-anchor="start"><tspan x="35" dy="0">Empty eligibility → no missing-state sampler; use the separately trained observed-only classifier.</tspan></text></svg>