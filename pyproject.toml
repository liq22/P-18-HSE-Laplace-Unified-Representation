[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hse-llapdiff-support-calibrated-representation"
version = "0.2.0"
description = "Theory and analytic oracle for HSE-conditioned Latent Laplace Diffusion"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
notebooks = [
  "nbformat>=5.9",
  "nbclient>=0.10",
  "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]
