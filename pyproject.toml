[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hse-laplace-unified-representation"
version = "0.1.0"
description = "Analytic foundation for observability-conditioned Laplace stochastic transport"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
notebooks = [
  "nbformat>=5.9",
  "nbclient>=0.10",
  "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]
