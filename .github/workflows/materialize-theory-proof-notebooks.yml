name: Materialize theory proof notebooks

on:
  push:
    branches:
      - agent/theory-proof-notebook-gate

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/theory-proof-notebook-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize the reviewed overlay
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/theory-notebooks.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]