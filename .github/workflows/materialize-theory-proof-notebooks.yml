name: Materialize theory proof notebooks

on:
  push:
    branches:
      - agent/theory-proof-notebook-gate

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/theory-proof-notebook-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize the reviewed overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk_*.b64 > /tmp/theory-notebooks.b64
          base64 --decode /tmp/theory-notebooks.b64 > /tmp/theory-notebooks.tar.gz
          tar -xzf /tmp/theory-notebooks.tar.gz -C .
          rm -rf .bootstrap
          rm .github/workflows/materialize-theory-proof-notebooks.yml
      - name: Validate materialized theory witnesses
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[notebooks]"
          python examples/analytic_unified_representation.py
          python -m unittest discover -s tests -v
          python theory/run_notebooks.py --timeout 180
      - name: Commit validated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No materialized changes" >&2; exit 1; }
          git commit -m "Add executable witnesses for every theory result"
          git push origin "HEAD:${GITHUB_REF_NAME}"
