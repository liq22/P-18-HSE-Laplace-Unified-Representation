name: hse-llapdiff-scientific-contract

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  analytic-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and Notebook runtime
        run: python -m pip install -e ".[notebooks]"
      - name: Run HSE-LLapDiff analytic oracle
        run: python examples/analytic_hse_llapdiff_oracle.py
      - name: Run scientific behavior tests
        run: python -m unittest discover -s tests -v
      - name: Execute all theory witnesses
        run: python theory/run_notebooks.py --timeout 180
