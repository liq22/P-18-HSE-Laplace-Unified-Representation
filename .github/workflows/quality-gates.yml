name: scientific-contract

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  semantic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run analytic prototype
        run: python examples/analytic_unified_representation.py
      - name: Run scientific semantic tests
        run: python -m unittest discover -s tests -v
