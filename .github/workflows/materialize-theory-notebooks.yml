name: Materialize theory notebooks

on:
  push:
    branches:
      - agent/theory-proof-notebook-gate

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and notebook runtime
        run: python -m pip install -e ".[notebooks]"
      - name: Generate output-free theory notebooks
        run: python theory/build_theory_notebooks.py
      - name: Remove the temporary materializer
        run: |
          rm theory/build_theory_notebooks.py
          rm .github/workflows/materialize-theory-notebooks.yml
      - name: Run analytic prototype and unit tests
        run: |
          python examples/analytic_unified_representation.py
          python -m unittest discover -s tests -v
      - name: Execute all theory witnesses
        run: python theory/run_notebooks.py --timeout 180
      - name: Commit validated notebook sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add executable witness for every theory result"
          git push origin "HEAD:${GITHUB_REF_NAME}"
