name: Repair theory formula encoding

on:
  push:
    branches:
      - agent/unified-representation-theory-foundation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair observed transfer corruption
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          repaired = []
          for path in sorted(Path("theory").glob("*.md")):
              text = path.read_text(encoding="utf-8")
              updated = text.replace("\x0crac", "\\frac")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  repaired.append(str(path))

          expected = {
              "theory/06_posterior_representation_sufficiency.md",
              "theory/13_identifiability_and_failure_boundaries.md",
          }
          if set(repaired) != expected:
              raise SystemExit(f"unexpected repaired files: {repaired}")

          for path in sorted(Path("theory").glob("*.md")):
              text = path.read_text(encoding="utf-8")
              invalid = [
                  (index, ord(character))
                  for index, character in enumerate(text)
                  if ord(character) < 32 and character not in "\t\n\r"
              ]
              if invalid:
                  raise SystemExit(f"invalid control characters in {path}: {invalid[:5]}")
          PY

      - name: Run scientific semantic tests
        run: |
          python -m pip install -e .
          python examples/analytic_unified_representation.py
          python -m unittest discover -s tests -v

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-theory-control-chars.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: repair theory formula encoding and verify corpus'
          git push origin "HEAD:${GITHUB_REF_NAME}"
